## Land tiles
# Order determines tile index (position 0 → Tile index 1).
# Keep ordered — tile constants are assigned by index.

# corner: the shape a tile's corners are cut to where it sticks out among other tiles
# (the neighboring tile shows in what is cut off). One of:
#   "none"      square: never cut, and nothing is cut to make room for it
#   "circle"    a quarter circle, as big as it gets (water)
#   "rounded"   a smaller quarter circle: a rounded rectangle. The default.
#   "diagonal"  cut straight across, as big as it gets (roads: a staircase of them gets straight edges)
#   "triangle"  a smaller straight cut
# Where tiles with different shapes meet, the more pronounced one is used for both
# (rounded < triangle < circle < diagonal).

# border: the color of a line, one pixel wide, painted along a tile's edge where it meets a
# different tile (also along cut corners), e.g. border = "#ffffff". Not given: no line.
# Opaque: "#rrggbb".

# height: how high a tile is, in pixels (a tile is 24 wide), from -24 to 24. Higher tiles cover
# lower ones, cast shadows on them, and get a lit rim. What stands on a tile is raised with it.
# Not given: 0 for land, 24 for walls and ore, -12 for water (sea, lake, canal: [[special_tile]]).

