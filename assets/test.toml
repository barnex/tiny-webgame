# General game settings
[game]

# For how many ticks decal effects (e.g. blood splatters) remain visible
decal_ttl = 50

# 🤖 For how many ticks an item stays reserved for the worker that set out to pick it up.
# The default, spelled out for the tests that count on it.
reserve_resources_ttl = 50


