# 🤖 For tests about job openings: a mine with a single job, so that a second worker is one too many.
# No cost: not for sale, so the build menu stays as it is (tests spawn it in god mode).
[[building]]
name = "solo_mine"
sprite = "workspace"
output = "coal"
hat = "hat_miner"
input = { rawcoal = 2 }
ticks_to_make = 5
size = 2
max_workers = 1

# 🤖 For tests about reserved jobs: a mine with a single job and one inhabitant (who works only there),
# so that the job is the inhabitant's and nobody else's. Not for sale, like `solo_mine`.
[[building]]
name = "family_mine"
sprite = "workspace"
output = "coal"
hat = "hat_miner"
input = { rawcoal = 2 }
ticks_to_make = 5
size = 2
max_workers = 1
housing = 1

# 🤖 A farm with a resident: its worker works only here (case093).
[[building]]
name = "farmstead"
sprite = "workspace"
output = "wheat"
input = { rawwheat = 2 }
ticks_to_make = 10
size = 3
range = 10
housing = 1

# 🤖 A factory of high-quality food (as in boring.toml), for case111: bread and an apple make an
#    apple tart, which workers eat off its output tile. Quick, so the test need not wait. No workers:
#    nobody hauls the tarts away. No inhabitant: nobody but the test's worker. Not for sale, like
#    `solo_mine`.
[[building]]
name = "cafe"
sprite = "cafe"
size = 2
output = "appletart"
# 🤖 Two tarts out at once (as in boring.toml): two eaters each reserve one (case112).
num_output_tiles = 2
input = { bread = 1, apple = 1 }
ticks_to_make = 1
max_workers = 0
housing = 0

# 🤖 A pawn that needs no food (case084).
[[pawn]]
name = "ghost"
pathfinding = "smart"
look = "ghost"
eating = { diet = ["food"], appetite = "picky", calories_per_day = 0, start_calories = 10 }

# 🤖 A hunter and its prey (as in boring.toml), for the hunting test. No min_population: no
#    migrant walks into a test.
[[pawn]]
name = "rat"
pathfinding = "dumb"
look = "rat"
