## Items
# Keep ordered
# Add items to the back only


[[item]]
name = "zerobad"

[[item]]
name = "rawwheat"
sprite = "wheat2"
calories = 1
special = 1

[[item]]
name = "food"
sprite = "chicken"
special = 2

# Any item that burns, counted in fuel: a "fuel" input takes coal, logs, ... (see `fuel` on items).
[[item]]
name = "fuel"
sprite = "fire"
special = 3

# Anything built with, counted in stone: a "stone" input (the HQ's, which pays for buildings)
# takes rock, brick, ... (see `stone` on items).
[[item]]
name = "stone"
sprite = "stone"
special = 4

# Any wood, counted in wood: a "wood" input (the HQ's, which pays for buildings) takes logs,
# planks, ... (see `wood` on items).
[[item]]
name = "wood"
special = 5

# A worker eats 10 calories a day (calories_per_day), and eats up to 3 days ahead (30).
# Each step of processing adds calories: 4 rawwheat (4) -> 2 wheat (6) -> 1 bread (10).
[[item]]
name = "wheat"
calories = 3
sprite = "leaf"

# Raw stone, found by the greystone on the map.
[[item]]
name = "rock"
stone = 1

[[item]]
name = "rawore"
sprite = "ore"

[[item]]
name = "coal"
sprite = "coalpack"
fuel = 3

[[item]]
name = "iron"

[[item]]
name = "apple"
sprite = "apple"
calories = 1

[[item]]
name = "rawbread"
sprite = "bread"
calories = 1
#on_heat = "bread"  # when heated, it becomes bread

# No stone yet: the masonry fires it into brick.
[[item]]
name = "clay"
sprite = "brick_raw"

[[item]]
name = "rawapple"
sprite = "apple"

[[item]]
name = "rawcoal"
sprite = "coal"

[[item]]
name = "iron_ore"
sprite = "orepack"
#on_heat = "iron"

# Beautiful: a gallery holding it is beautiful (beauty), and idle workers go there for leisure.
[[item]]
name = "painting"
sprite = "painting1"
beauty = 10

[[item]]
name = "canvas"

# 3 wood in one item, from the sawmill: cheaper to haul far.
[[item]]
name = "plank"
wood = 3
fuel = 3

# Raw wood, chopped from trees.
[[item]]
name = "log"
sprite = "wood"
fuel = 1
wood = 1

[[item]]
name = "paper"
sprite = "scroll"

[[item]]
name = "appletart"
sprite = "cake_apple"
# 🤖 High-quality food: more than bread (10) and an apple (1). Nothing makes it yet.
calories = 15

# A day's food in one item: worth hauling far.
[[item]]
name = "bread"
sprite = "bread"
calories = 10
# A hauler brings 3 loaves per trip: a cafe feeds 3 eaters for one walk to the bakery.
max_carry = 3

# Bones burn. Nobody said this game is nice.
[[item]]
name = "skeleton"
sprite = "skeleton"
fuel = 1

[[item]]
name = "paint"
sprite = "paint_bucket"

# Wood burnt down to dense fuel: 3 wood (3 fuel) make 1 charcoal (4 fuel), cheaper to haul far.
[[item]]
name = "charcoal"
sprite = "coal"
fuel = 4

# Found by the claystone on the map: the clay pit makes clay of it.
[[item]]
name = "rawclay"
sprite = "clay"

# 3 stone in one item: from the quarry (3 rock) or the masonry (clay and fuel), cheaper to haul far.
[[item]]
name = "brick"
sprite = "brick"
stone = 3

[[building]]
name = "home"
size = 2
sprite = "floor_wood2"
housing = 1
walls = "wall"
floor = "floor_decor"
cost = {stone = 10, food = 30}
description = "provides a worker to nearby buildings"

[[building]]
name = "appletree"
sprite = "appletree"
shadow = "treeshade"
size = 2
output = "apple"
input = {}
# A little free food, to get going: ~6 apples a day.
fruit_per_cycle = 0.01
neutral = true

# A tree holds 20 wood (its health: a logger's chop takes one). It drops a branch now and
# then, and plants a new tree nearby every few days: slow logging lasts, clear-cutting doesn't.
[[building]]
name = "tree"
sprite = "tree"
shadow = "treeshade"
size = 2
output = "log"
health = 20
fruit_per_cycle = 0.002
spread_per_day = 0.2
neutral = true

[[building]]
name = "smalltree"
sprite = "tree"
shadow = "treeshade"
size = 1
neutral = true

