# 🤖 A bread provider: bread in, bread out. Its hauler brings bread from the bakery 3 at a time
#    and it puts the loaves out on its output tiles, where workers come to eat them: cheaper than
#    each eater walking to the bakery for one loaf. It never hauls them away (`output_range` 0):
#    you have to go there.
[[building]]
name = "cafe"
sprite = "cafe"
hat = "hat_cook"
size = 2
# 🤖 One in, one out: it makes nothing. Its intake holds one haul (3 × 1).
input = { bread = 1 }
output = "bread"
# 🤖 Two loaves out at once: two eaters can each reserve one.
num_output_tiles = 2
ticks_to_make = 1
# 🤖 Its stock: the loaves waiting behind those on its tiles.
output_capacity = 20
output_range = 0
max_workers = 1
# 🤖 Its hauler brings 3 at once: cheaper than eaters each walking to the bakery, which makes
#    eating at the cafe worth it.
cost = {stone = 10, food = 30}
housing = 1
range = 50
walls = "wall"

