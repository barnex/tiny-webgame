[[land_tile]]
name = "snow"
border = "#ffffff"

[[land_tile]]
name = "dry_grass"
sprite = "dry_grass"

## Road tiles
# 🤖 Walked on fast; land tiles are walked on slowly.
# 🤖 Order determines tile index, as for land tiles: road comes first (`Tile::Road`).

[[road_tile]]
