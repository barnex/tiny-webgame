## Pawns are things that can move
# Keep ordered

[[pawn]]
name = "king"
pathfinding = "smart"
look = "king"
eating = { diet = ["food"], appetite = "picky", calories_per_day = 1, start_calories = 10 }
on_spawn = [{spawn = "butterfly"}]

[[pawn]]
name = "swordsman"
pathfinding = "smart"
look = "swordsman"
eating = { diet = ["food"], appetite = "picky", calories_per_day = 1, start_calories = 10 }
ticks_per_attack = 5
melee_damage = 10
cost = { stone = 5 }

[[pawn]]
name = "archer"
pathfinding = "smart"
look = "archer"
eating = { diet = ["food"], appetite = "picky", calories_per_day = 1, start_calories = 10 }
health = 70
ticks_per_attack = 5
# arrow: track_target=true (default), sprite=None ⇒ line visual, range=12 (default)
shoots_projectile = { damage = 10, range = 5, track_target = true, sprite = "arrow_red" }
cost = { stone = 3, wood = 2 }
on_killed = [
    {animation = { sprites = ["crane_l", "crane_l2", "crane_l3", "crane_l4"]}},
]

[[pawn]]
name = "demon"
pathfinding = "smart"
look = "demon"
eating = { diet = ["food"], appetite = "picky", calories_per_day = 1, start_calories = 10 }
health = 200
ticks_per_attack = 2
# fixed-tile fireball: damage at impact tile, spawn "fire" blueprint there
shoots_projectile = { damage = 30, range = 5, track_target = false, projectile = "fire", sprite = "fire" }
cost = { stone = 10 }
on_killed = [{spawn = "fire"}]

