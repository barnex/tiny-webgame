# General game settings
[game]

# For how many ticks decal effects (e.g. blood splatters) remain visible
decal_ttl = 50

## Industry

# Chops trees in range for wood when none lies around, and keeps it: a depot, so the bakery,
# sawmill and kiln take their wood from here.
[[building]]
name = "logger"
sprite = "workbench"
hat = "hat_builder"
size = 2
housing = 1
max_workers = 1
input = { log = 10 }
chops = "tree"
depot = true
cost = {stone = 10}

[[building]]
name = "charcoal_kiln"
sprite = "fireplace"
hat = "hat_miner"
size = 2
input = { log = 3 }
output = "charcoal"
ticks_to_make = 20
max_workers = 2
cost = {stone = 10}

# 🤖 A factory of high-quality food: bread and an apple make an apple tart, more calories than
#    both. Workers eat the tarts off its output tile.
[[building]]
name = "cafe"
sprite = "cafe"
hat = "hat_cook"
size = 2
input = { bread = 1, apple = 1 }
output = "appletart"
# 🤖 Two tarts out at once: two eaters can each reserve one.
num_output_tiles = 2
ticks_to_make = 20
max_workers = 1
# 🤖 Its hauler brings 3 at once: cheaper than eaters each walking to the bakery and the orchard
#    for bread and apples, which makes eating at the cafe worth it.
carry = 3
cost = {stone = 10, food = 30}
housing = 1
range = 50
walls = "wall"

# Keeps goods for the buildings around it, and passes them on to emptier depots in range: a
# chain of depots carries goods far.
[[building]]
name = "depot"
sprite = "crate"
size = 2
input = { wheat = 10, bread = 10, coal = 10, log = 10 }
depot = true
range = 20
max_workers = 2
# Its haulers move goods 3 at a time.
carry = 3
cost = {stone = 10}

# Depots for one good each: they keep more of it than the depot, which shares its room among four.
[[building]]
name = "brick_depot"
sprite = "crate"
size = 2
input = { brick = 20 }
depot = true
range = 20
max_workers = 2
carry = 3
cost = {stone = 10}

[[building]]
name = "coal_depot"
sprite = "crate"
size = 2
input = { coal = 20 }
depot = true
range = 20
max_workers = 2
carry = 3
cost = {stone = 10}

[[building]]
