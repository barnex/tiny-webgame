## Worker — a pawn that works rather than fights.
## Kept at the end so combat/animal SoldierTyp indices stay stable.

[[pawn]]
name = "worker"
sprite = "pawn1"
health = 10
range = 0
awake_time = 500
sleep_time = 100
hat_offset = [-1, 0]
on_killed = [{ spawn = "skeleton" }]
animations = { walk = { sprites = ["walk1", "walk2"], speed = 0.5 } }
first_names = ["Billy", "Bob"]
last_names = ["A", "B"]


